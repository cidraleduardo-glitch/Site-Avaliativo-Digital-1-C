<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJo Universe | D4C</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Navegação Principal">
            <div class="logo">JOJO<span>D4C</span></div>
            <div class="accessibility-bar">
                <button onclick="changeFontSize('increase')" title="Aumentar Fonte">A+</button>
                <button onclick="changeFontSize('decrease')" title="Diminuir Fonte">A-</button>
                <button onclick="toggleContrast()" title="Alto Contraste">◐</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="reveal">
            <h1>Dirty Deeds Done Dirt Cheap</h1>
            <p>A travessia dimensional de Steel Ball Run começa aqui.</p>
        </section>

        <section id="parts" class="reveal">
            <h2>Arcos da História</h2>
            <div id="parts-grid" class="grid-container">
                </div>
        </section>

        <section id="d4c-section" class="reveal">
            <h2>Stand: D4C</h2>
            <div id="d4c-accordion" class="accordion">
                </div>
        </section>

        <section id="gallery" class="reveal">
            <h2>Habilidades Multidimensionais</h2>
            <div class="carousel-container">
                <div id="carousel-track" class="track">
                    </div>
                <div class="carousel-controls">
                    <button id="prevBtn">Anterior</button>
                    <button id="nextBtn">Próximo</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Desenvolvido com foco em UX e Acessibilidade.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
