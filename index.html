<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoJo Stands Archive | D4C, Smooth Operators & Soft & Wet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Menu Principal">
            <div class="logo">JOJO<span>Stands</span></div>
            <div class="accessibility-controls">
                <button id="increase-font" aria-label="Aumentar fonte">A+</button>
                <button id="decrease-font" aria-label="Diminuir fonte">A-</button>
                <button id="toggle-contrast" aria-label="Alternar Alto Contraste">🌓</button>
            </div>
        </nav>
    </header>

    <main>
        <section id="hero" class="reveal">
            <h1>Galeria de Stands</h1>
            <p>Uma exploração visual e técnica dos Stands mais icônicos das partes 7, 8 e 9.</p>
        </section>

        <section id="stands-carousel" class="reveal" aria-labelledby="carousel-title">
            <h2 id="carousel-title" class="sr-only">Carrossel de Stands</h2>
            <div class="carousel-container">
                <div id="carousel-track" class="carousel-track">
                    </div>
                <div class="carousel-nav">
                    <button id="prevBtn" aria-label="Stand Anterior">❮</button>
                    <button id="nextBtn" aria-label="Próximo Stand">❯</button>
                </div>
            </div>
        </section>

        <section id="details" class="reveal">
            <h2>Habilidades Detalhadas</h2>
            <div id="accordion-container" class="accordion">
                </div>
        </section>
    </main>

    <footer class="reveal">
        <p>&copy; 2024 - Criado com foco em UX e Design Inclusivo.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
